<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gorillas • Topologia de Rede</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --muted: #f5f7fb;
      --text: #0f172a;
      --sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, .10);
      --shadow-soft: 0 6px 16px rgba(15, 23, 42, .08);
      --accent: #ff6a00;
      --accent-2: #0ea5e9;
      --ok: #16a34a;
      --warn: #f59e0b;
      --bad: #ef4444;
      --radius: 16px;
      --radius-sm: 12px;
      --focus: 0 0 0 4px rgba(14, 165, 233, .18);
      --maxw: 1180px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% 0%, rgba(255, 106, 0, .10), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(14, 165, 233, .10), transparent 55%),
        linear-gradient(#ffffff, #ffffff);
    }

    a {
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    ::selection {
      background: rgba(255, 106, 0, .22);
    }

    /* Layout */
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, .82);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      user-select: none;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255, 255, 255, .65), transparent 60%),
        linear-gradient(135deg, rgba(255, 106, 0, 1), rgba(14, 165, 233, 1));
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, .6);
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: .2px;
      line-height: 1.1;
    }

    .brand p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: var(--sub);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .03);
      border: 1px solid rgba(226, 232, 240, .9);
      color: var(--sub);
      font-size: 12px;
      user-select: none;
    }

    .main {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      background: rgba(255, 255, 255, .70);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 12px;
      position: sticky;
      top: 76px;
      height: calc(100vh - 92px);
      overflow: auto;
    }

    .nav-title {
      padding: 10px 10px 6px;
      font-size: 12px;
      color: var(--sub);
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav a {
      text-decoration: none;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: var(--text);
    }

    .nav a:hover {
      background: rgba(15, 23, 42, .03);
      border-color: rgba(226, 232, 240, .9);
    }

    .nav a.active {
      background: rgba(255, 106, 0, .10);
      border-color: rgba(255, 106, 0, .25);
    }

    .nav .icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, .04);
      border: 1px solid rgba(226, 232, 240, .9);
      font-size: 16px;
    }

    .nav a.active .icon {
      background: rgba(255, 106, 0, .12);
      border-color: rgba(255, 106, 0, .25);
    }

    .content {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .panel {
      background: rgba(255, 255, 255, .80);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 16px;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .panel-header p {
      margin: 6px 0 0 0;
      color: var(--sub);
      font-size: 13px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    /* Controls */
    .btn {
      border: 1px solid rgba(226, 232, 240, .95);
      background: white;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(15, 23, 42, .04);
      display: inline-flex;
      gap: 8px;
      align-items: center;
      transition: transform .04s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      user-select: none;
    }

    .btn:hover {
      border-color: rgba(148, 163, 184, .7);
      box-shadow: var(--shadow-soft);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, rgba(255, 106, 0, 1), rgba(255, 136, 58, 1));
      border-color: rgba(255, 106, 0, .35);
      color: white;
    }

    .btn.primary:hover {
      box-shadow: 0 12px 26px rgba(255, 106, 0, .20);
    }

    .btn.danger {
      border-color: rgba(239, 68, 68, .25);
      background: rgba(239, 68, 68, .06);
      color: rgba(153, 27, 27, 1);
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 220px;
    }

    .field label {
      font-size: 12px;
      color: var(--sub);
    }

    .input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(226, 232, 240, .95);
      background: white;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
    }

    .input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(14, 165, 233, .55);
      box-shadow: var(--focus);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    /* Table */
    .table-wrap {
      overflow: auto;
      border: 1px solid rgba(226, 232, 240, .95);
      border-radius: 14px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      text-align: left;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(226, 232, 240, .85);
      font-size: 13px;
      vertical-align: top;
    }

    th {
      font-size: 12px;
      color: var(--sub);
      background: rgba(15, 23, 42, .02);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td {
      background: rgba(15, 23, 42, .015);
    }

    .td-actions {
      white-space: nowrap;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(226, 232, 240, .95);
      background: rgba(15, 23, 42, .02);
      color: var(--sub);
      white-space: nowrap;
    }

    .badge.accent {
      border-color: rgba(255, 106, 0, .25);
      background: rgba(255, 106, 0, .10);
      color: rgba(124, 45, 18, 1);
    }

    .badge.info {
      border-color: rgba(14, 165, 233, .25);
      background: rgba(14, 165, 233, .10);
      color: rgba(12, 74, 110, 1);
    }

    /* Topology */
    .topology {
      width: 100%;
      height: 520px;
      border-radius: var(--radius);
      border: 1px solid rgba(226, 232, 240, .95);
      background:
        linear-gradient(transparent, transparent),
        radial-gradient(700px 420px at 10% 10%, rgba(255, 106, 0, .10), transparent 60%),
        radial-gradient(620px 420px at 90% 10%, rgba(14, 165, 233, .10), transparent 60%),
        #ffffff;
      overflow: hidden;
      position: relative;
    }

    .topology svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .topology .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(226, 232, 240, .95);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--sub);
      box-shadow: var(--shadow-soft);
    }

    /* Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      display: none;
      z-index: 50;
      padding: 16px;
    }

    .backdrop.open {
      display: grid;
      place-items: center;
    }

    .modal {
      width: min(720px, 100%);
      background: white;
      border-radius: 18px;
      border: 1px solid rgba(226, 232, 240, .95);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(226, 232, 240, .85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 14px;
    }

    .modal-body {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-foot {
      padding: 14px 16px;
      border-top: 1px solid rgba(226, 232, 240, .85);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Toast */
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      display: grid;
      gap: 10px;
      pointer-events: none;
    }

    .toast-item {
      pointer-events: auto;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(226, 232, 240, .95);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 280px;
      max-width: 360px;
    }

    .toast-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 4px;
      background: var(--accent-2);
    }

    .toast-item.ok .toast-dot {
      background: var(--ok);
    }

    .toast-item.bad .toast-dot {
      background: var(--bad);
    }

    .toast-title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .toast-msg {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: var(--sub);
    }

    /* Responsive */
    @media (max-width: 980px) {
      .main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        top: auto;
        height: auto;
      }

      table {
        min-width: 640px;
      }
    }

    @media (max-width: 560px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      table {
        min-width: 560px;
      }

      .brand p {
        display: none;
      }
    }

    /* A11y helpers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <!-- Firebase SDK (compat - zero build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>

<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard" aria-label="Ir para o painel">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>Gorillas • Topologia de Rede</h1>
            <p>Controle, CRUD e desenho da rede do estabelecimento</p>
          </div>
        </a>

        <div class="topbar-actions" id="topbarActions">
          <span class="pill" id="pillStatus">● Offline (local)</span>
          <button class="btn" id="btnExport" type="button">⬇️ Exportar</button>
          <button class="btn" id="btnImport" type="button">⬆️ Importar</button>
          <button class="btn danger" id="btnReset" type="button">🧹 Reset</button>
        </div>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="nav-title">Navegação</div>
        <nav class="nav" id="nav">
          <a href="#/dashboard" data-route="/dashboard">
            <span class="icon" aria-hidden="true">📊</span>
            <div>
              <div style="font-weight:700; font-size:13px;">Painel</div>
              <div style="font-size:12px; color:var(--sub);">Visão geral</div>
            </div>
          </a>

          <a href="#/dispositivos" data-route="/dispositivos">
            <span class="icon" aria-hidden="true">🧩</span>
            <div>
              <div style="font-weight:700; font-size:13px;">Dispositivos</div>
              <div style="font-size:12px; color:var(--sub);">CRUD de ativos</div>
            </div>
          </a>

          <a href="#/conexoes" data-route="/conexoes">
            <span class="icon" aria-hidden="true">🔗</span>
            <div>
              <div style="font-weight:700; font-size:13px;">Conexões</div>
              <div style="font-size:12px; color:var(--sub);">Links e portas</div>
            </div>
          </a>

          <a href="#/topologia" data-route="/topologia">
            <span class="icon" aria-hidden="true">🗺️</span>
            <div>
              <div style="font-weight:700; font-size:13px;">Topologia</div>
              <div style="font-size:12px; color:var(--sub);">Desenho da rede</div>
            </div>
          </a>

          <a href="#/configuracoes" data-route="/configuracoes">
            <span class="icon" aria-hidden="true">⚙️</span>
            <div>
              <div style="font-weight:700; font-size:13px;">Configurações</div>
              <div style="font-size:12px; color:var(--sub);">Base e dados</div>
            </div>
          </a>
        </nav>

        <div class="nav-title" style="margin-top:10px;">Atalho rápido</div>
        <div style="display:grid; gap:10px; padding: 0 6px 6px;">
          <button class="btn primary" id="btnQuickNewDevice" type="button">➕ Novo dispositivo</button>
          <button class="btn" id="btnQuickNewLink" type="button">➕ Nova conexão</button>
        </div>
      </aside>

      <section class="content" id="view">
        <!-- render -->
      </section>
    </main>
  </div>

  <!-- Modal / Dialog -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button class="btn" type="button" id="btnCloseModal" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <p id="modalDesc" class="sr-only">Formulário em janela modal</p>
      </div>
      <div class="modal-foot" id="modalFoot">
        <button class="btn" type="button" id="btnModalCancel">Cancelar</button>
        <button class="btn primary" type="button" id="btnModalSave">Salvar</button>
      </div>
    </div>
  </div>

  <input id="fileImport" type="file" accept="application/json" class="sr-only" />

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <script>
    /******************************************************************
     * Gorillas • Topologia de Rede
     * - SPA com hash routing (GitHub Pages friendly)
     * - CRUD básico (Dispositivos + Conexões)
     * - Desenho simples de topologia em SVG
     * - Persistência via Firebase Realtime Database + cache localStorage
     ******************************************************************/

    // =========================
    // Firebase Init
    // =========================
    const firebaseConfig = {
      apiKey: "AIzaSyAuZ_RWLLn26CqUy3zpyz75_IuQSVQti2k",
      authDomain: "projectshub-marc35.firebaseapp.com",
      databaseURL: "https://projectshub-marc35-default-rtdb.firebaseio.com",
      projectId: "projectshub-marc35",
      storageBucket: "projectshub-marc35.firebasestorage.app",
      messagingSenderId: "949883815683",
      appId: "1:949883815683:web:7367cf58a2d23acbb34b36",
      measurementId: "G-EPKZTRGGGC"
    };
    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();
    const dbRef = rtdb.ref("gorillas_net");

    let firebaseConnected = false;

    // =========================
    // Utils
    // =========================
    const $ = (sel, el = document) => el.querySelector(sel);
    const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

    function nowISO() { return new Date().toISOString(); }

    function uid() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return "id-" + Math.random().toString(16).slice(2) + "-" + Date.now().toString(16);
    }

    function safeJSONParse(text, fallback) {
      try { return JSON.parse(text); } catch { return fallback; }
    }

    function fmtDate(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    }

    function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }

    // =========================
    // DB (Firebase RTDB + localStorage cache)
    // =========================
    const DB_KEY = "gorillas_netdb_v1";

    const DEFAULT_DB = {
      meta: { app: "GorillasNet", version: 1, createdAt: nowISO(), updatedAt: nowISO() },
      dispositivos: [
        { id: uid(), nome: "Roteador Principal", tipo: "Roteador", ip: "192.168.0.1", mac: "AA:BB:CC:DD:EE:01", local: "Caixa / Balcão", notas: "Gateway + DHCP", createdAt: nowISO(), updatedAt: nowISO() },
        { id: uid(), nome: "Switch 24p", tipo: "Switch", ip: "192.168.0.2", mac: "AA:BB:CC:DD:EE:02", local: "Rack", notas: "Distribuição", createdAt: nowISO(), updatedAt: nowISO() },
        { id: uid(), nome: "AP Salão", tipo: "Access Point", ip: "192.168.0.10", mac: "AA:BB:CC:DD:EE:10", local: "Salão", notas: "Wi-Fi clientes", createdAt: nowISO(), updatedAt: nowISO() },
      ],
      conexoes: [
      ]
    };

    /** Lê cache local (fallback instantâneo) */
    function loadDBFromCache() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) return structuredClone(DEFAULT_DB);
      const parsed = safeJSONParse(raw, null);
      if (!parsed || typeof parsed !== "object") return structuredClone(DEFAULT_DB);
      parsed.meta = parsed.meta || { app: "GorillasNet", version: 1, createdAt: nowISO(), updatedAt: nowISO() };
      parsed.dispositivos = Array.isArray(parsed.dispositivos) ? parsed.dispositivos : [];
      parsed.conexoes = Array.isArray(parsed.conexoes) ? parsed.conexoes : [];
      return parsed;
    }

    /** Salva no cache local */
    function saveDBToCache(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    /** Salva no Firebase RTDB (+ cache local) */
    function saveDB(db) {
      db.meta.updatedAt = nowISO();
      saveDBToCache(db);
      dbRef.set(db).catch(err => {
        console.error("Firebase saveDB error:", err);
        toast("bad", "Firebase", "Erro ao salvar no servidor. Dados salvos localmente.");
      });
    }

    // =========================
    // Firebase real-time listener + connection status
    // =========================
    function initFirebaseSync() {
      // Connection status
      rtdb.ref(".info/connected").on("value", (snap) => {
        firebaseConnected = !!snap.val();
        updateStatusPill();
      });

      // Real-time data listener
      dbRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (data && typeof data === "object") {
          // Garantir que arrays existem (RTDB converte arrays vazios em null)
          data.dispositivos = Array.isArray(data.dispositivos) ? data.dispositivos : [];
          data.conexoes = Array.isArray(data.conexoes) ? data.conexoes : [];
          data.meta = data.meta || { app: "GorillasNet", version: 1, createdAt: nowISO(), updatedAt: nowISO() };

          appState.db = data;
          saveDBToCache(data);
          render();
        } else {
          // RTDB vazio (primeiro uso) - faz push dos dados iniciais
          console.log("Firebase RTDB vazio. Enviando dados iniciais...");
          const initial = loadDBFromCache();
          dbRef.set(initial).then(() => {
            toast("ok", "Firebase", "Dados iniciais enviados para o servidor.");
          }).catch(err => {
            console.error("Firebase init push error:", err);
          });
        }
      }, (err) => {

    function toast(kind, title, msg) {
      const host = $("#toast");
      const item = document.createElement("div");
      item.className = "toast-item " + (kind || "");
      item.innerHTML = `

    function escapeHTML(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    // =========================
    // Modal (com foco “preso”)
    // =========================
    const modal = {
      open: false,
      lastFocus: null,
      onSave: null,
      focusables: [],
    };

    function openModal({ title, bodyHTML, onSave, saveLabel = "Salvar" }) {
      modal.open = true;
      modal.onSave = onSave || null;
      modal.lastFocus = document.activeElement;

      $("#modalTitle").textContent = title || "Modal";
      $("#modalBody").innerHTML = bodyHTML || "";
      $("#btnModalSave").textContent = saveLabel;

      const bd = $("#backdrop");
      bd.classList.add("open");
      bd.setAttribute("aria-hidden", "false");

      // focusables
      modal.focusables = $$("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])", bd)
        .filter(el => !el.disabled && el.offsetParent !== null);

      // foca no primeiro input do body (se tiver), senão no salvar
      const firstInput = $("#modalBody input, #modalBody select, #modalBody textarea");
      (firstInput || $("#btnModalSave")).focus();
      document.addEventListener("keydown", onModalKeydown, true);
    }

    function closeModal() {
      modal.open = false;
      modal.onSave = null;

      const bd = $("#backdrop");
      bd.classList.remove("open");
      bd.setAttribute("aria-hidden", "true");

      document.removeEventListener("keydown", onModalKeydown, true);

      if (modal.lastFocus && typeof modal.lastFocus.focus === "function") {
        modal.lastFocus.focus();
      }
    }

    function onModalKeydown(e) {
      if (!modal.open) return;

      if (e.key === "Escape") {
        e.preventDefault();
        closeModal();
        return;
      }

      if (e.key === "Tab") {
        // foco preso no modal (ciclo)
        const f = modal.focusables;
        if (!f.length) return;

        const first = f[0];
        const last = f[f.length - 1];
        const active = document.activeElement;

        if (e.shiftKey && active === first) {
          e.preventDefault(); last.focus(); return;
        }
        if (!e.shiftKey && active === last) {
          e.preventDefault(); first.focus(); return;
        }
      }
    }

    $("#btnCloseModal").addEventListener("click", closeModal);
    $("#btnModalCancel").addEventListener("click", closeModal);
    $("#btnModalSave").addEventListener("click", () => {
      if (typeof modal.onSave === "function") modal.onSave();
    });
    $("#backdrop").addEventListener("click", (e) => {
      if (e.target === $("#backdrop")) closeModal();
    });

    // =========================
    // Topology SVG
    // =========================
    function renderTopologySVG(dispositivos, conexoes) {
      if (!dispositivos.length) {
        return `
          <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Topologia vazia">
            <rect x="0" y="0" width="1000" height="520" fill="transparent"/>
            <text x="500" y="250" text-anchor="middle" font-size="18" fill="#475569" font-family="${getComputedStyle(document.body).fontFamily}">
              Nenhum dispositivo cadastrado ainda
            </text>
            <text x="500" y="280" text-anchor="middle" font-size="13" fill="#64748b" font-family="${getComputedStyle(document.body).fontFamily}">
              Vá em “Dispositivos” para começar
            </text>
          </svg>
        `;
      }

      // Layout simples: agrupar por tipo e distribuir em linhas
      const groups = groupBy(dispositivos, d => d.tipo || "Outro");
      const tipos = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);

      const W = 1000, H = 520;
      const pad = 34;
      const rowH = (H - pad * 2) / Math.max(1, tipos.length);
      const nodeW = 170, nodeH = 56;

      const pos = new Map(); // id -> {x,y,cx,cy}
      tipos.forEach((tipo, row) => {
        const items = groups[tipo];
        const cols = Math.max(1, items.length);
        const gap = clamp((W - pad * 2 - cols * nodeW) / Math.max(1, cols - 1), 14, 90);
        const startX = pad + Math.max(0, (W - pad * 2 - (cols * nodeW + (cols - 1) * gap)) / 2);
        const y = pad + row * rowH + (rowH - nodeH) / 2;

        items.forEach((d, i) => {
          const x = startX + i * (nodeW + gap);
          pos.set(d.id, { x, y, cx: x + nodeW / 2, cy: y + nodeH / 2 });
        });
      });

      const devById = new Map(dispositivos.map(d => [d.id, d]));

      // Linhas (conexões)
      const lines = conexoes
        .map(l => {
          const a = pos.get(l.deId);
          const b = pos.get(l.paraId);
          if (!a || !b) return "";
          const isWifi = (l.tipo || "").toLowerCase().includes("wi");
          const stroke = isWifi ? "rgba(14,165,233,.75)" : "rgba(255,106,0,.70)";
          const dash = isWifi ? 'stroke-dasharray="6 6"' : "";
          return `
            <line x1="${a.cx}" y1="${a.cy}" x2="${b.cx}" y2="${b.cy}" stroke="${stroke}" stroke-width="3" ${dash} />
          `;
        })
        .join("");

      // Nodes
      const nodes = dispositivos.map(d => {
        const p = pos.get(d.id);
        const subtitle = [d.ip || "", d.local || ""].filter(Boolean).join(" • ");
        return `
          <g>
            <rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="14"
              fill="rgba(255,255,255,.92)" stroke="rgba(226,232,240,.95)" />
            <text x="${p.x + 12}" y="${p.y + 22}" font-size="13" fill="#0f172a" font-weight="700" font-family="${getComputedStyle(document.body).fontFamily}">
              ${escapeXML(d.nome)}
            </text>
            <text x="${p.x + 12}" y="${p.y + 40}" font-size="11" fill="#475569" font-family="${getComputedStyle(document.body).fontFamily}">
              ${escapeXML((d.tipo || "Outro") + (subtitle ? " • " + subtitle : ""))}
            </text>
          </g>
        `;
      }).join("");

      // Legend
      const legend = `
        <g>
          <rect x="14" y="${H - 54}" width="280" height="38" rx="14" fill="rgba(255,255,255,.86)" stroke="rgba(226,232,240,.95)"/>
          <line x1="28" y1="${H - 35}" x2="60" y2="${H - 35}" stroke="rgba(255,106,0,.70)" stroke-width="3"/>
          <text x="68" y="${H - 31}" font-size="12" fill="#475569" font-family="${getComputedStyle(document.body).fontFamily}">Cabo</text>
          <line x1="122" y1="${H - 35}" x2="154" y2="${H - 35}" stroke="rgba(14,165,233,.75)" stroke-width="3" stroke-dasharray="6 6"/>
          <text x="162" y="${H - 31}" font-size="12" fill="#475569" font-family="${getComputedStyle(document.body).fontFamily}">Wi-Fi</text>
        </g>
      `;

      return `
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Topologia da rede">
          ${lines}
          ${nodes}
          ${legend}
        </svg>
      `;
    }

    function escapeXML(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

            <div class="field">
              <label>Nome *</label>
              <input class="input" id="f_nome" placeholder="Ex.: Switch 24p, AP Salão, PDV 01..." value="${escapeHTML(d.nome)}" />
            </div>
            <div class="field">
              <label>Tipo</label>
              <select id="f_tipo">
                ${["Roteador", "Switch", "Access Point", "Servidor", "DVR/CFTV", "Impressora", "PDV/Terminal", "Computador", "Outro"].map(t => `
                  <option value="${escapeHTML(t)}" ${t === d.tipo ? "selected" : ""}>${escapeHTML(t)}</option>
                `).join("")}
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>IP</label>
              <input class="input" id="f_ip" placeholder="Ex.: 192.168.0.10" value="${escapeHTML(d.ip)}" />
            </div>
            <div class="field">
              <label>MAC</label>
              <input class="input" id="f_mac" placeholder="Ex.: AA:BB:CC:DD:EE:FF" value="${escapeHTML(d.mac)}" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Local</label>
              <input class="input" id="f_local" placeholder="Ex.: Rack, Cozinha, Caixa, Salão..." value="${escapeHTML(d.local)}" />
            </div>
            <div class="field">
              <label>Observações</label>
              <input class="input" id="f_notas" placeholder="Ex.: Uplink, VLAN, DHCP, SSID..." value="${escapeHTML(d.notas)}" />
            </div>
          </div>

          <div style="color:var(--sub); font-size:12px;">
            * Campo obrigatório.
          </div>
        `,
        onSave: () => {
          const nome = $("#f_nome").value.trim();
          if (!nome) {
            toast("bad", "Validação", "Informe um nome para o dispositivo.");
            $("#f_nome").focus();
            return;
          }
          const payload = {
            id: d.id || uid(),
            nome,
            tipo: $("#f_tipo").value,
            ip: $("#f_ip").value.trim(),
            mac: $("#f_mac").value.trim(),
            local: $("#f_local").value.trim(),
            notas: $("#f_notas").value.trim(),
            createdAt: d.createdAt || nowISO(),
            updatedAt: nowISO(),
          };

          if (isEdit) {
            const idx = appState.db.dispositivos.findIndex(x => x.id === d.id);
            if (idx >= 0) appState.db.dispositivos[idx] = payload;
            toast("ok", "Dispositivo", "Alterações salvas.");
          } else {
            appState.db.dispositivos.push(payload);
            toast("ok", "Dispositivo", "Dispositivo criado.");
          }

          saveDB(appState.db);
          closeModal();
          render();
        }
      });
    }

    function deleteDevice(id) {
      const d = appState.db.dispositivos.find(x => x.id === id);
      if (!d) return;

      openModal({
        title: "Excluir dispositivo",
        saveLabel: "Excluir",
        bodyHTML: `
          <div style="color:var(--sub); font-size:13px; line-height:1.5;">
            Você está prestes a excluir <b>${escapeHTML(d.nome)}</b>.<br/>
            Isso também removerá conexões relacionadas automaticamente.
          </div>
        `,
        onSave: () => {
          appState.db.dispositivos = appState.db.dispositivos.filter(x => x.id !== id);
          appState.db.conexoes = appState.db.conexoes.filter(l => l.deId !== id && l.paraId !== id);
          saveDB(appState.db);
          closeModal();
          toast("ok", "Exclusão", "Dispositivo removido.");
          render();
        }
      });
      // torna o botão perigoso visualmente
      $("#btnModalSave").classList.add("danger");
      $("#btnModalSave").classList.remove("primary");
    }

    // =========================
    // CRUD - Conexões
    // =========================
    function openLinkForm(link) {
      const isEdit = !!link;
      const l = link || { id: null, deId: "", paraId: "", tipo: "Cabo", portaDe: "", portaPara: "", velocidade: "1 Gbps", notas: "" };

      if (appState.db.dispositivos.length < 2) {
        toast("bad", "Conexões", "Cadastre pelo menos 2 dispositivos antes.");
        navigate("/dispositivos");
        return;
      }

      const options = appState.db.dispositivos
        .map(d => `<option value="${escapeHTML(d.id)}">${escapeHTML(d.nome)} (${escapeHTML(d.tipo || "Outro")})</option>`)
        .join("");

      openModal({
        title: isEdit ? "Editar conexão" : "Nova conexão",
        saveLabel: isEdit ? "Salvar alterações" : "Criar conexão",
        bodyHTML: `
          <div class="grid-2">
            <div class="field">
              <label>De *</label>
              <select id="f_de">
                <option value="">Selecione…</option>
                ${options}
              </select>
            </div>
            <div class="field">
              <label>Para *</label>
              <select id="f_para">
                <option value="">Selecione…</option>
                ${options}
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Tipo</label>
              <select id="f_ltipo">
                ${["Cabo", "Wi-Fi", "Fibra/Uplink", "VPN", "Outro"].map(t => `
                  <option value="${escapeHTML(t)}">${escapeHTML(t)}</option>
                `).join("")}
              </select>
            </div>
            <div class="field">
              <label>Velocidade</label>
              <select id="f_vel">
                ${["100 Mbps", "1 Gbps", "2.5 Gbps", "10 Gbps", "—"].map(v => `
                  <option value="${escapeHTML(v)}">${escapeHTML(v)}</option>
                `).join("")}
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Porta (De)</label>
              <input class="input" id="f_pde" placeholder="Ex.: LAN1, 24, Gi0/1..." />
            </div>
            <div class="field">
              <label>Porta (Para)</label>
              <input class="input" id="f_ppara" placeholder="Ex.: LAN2, 1, Gi0/24..." />
            </div>
          </div>

          <div class="field">
            <label>Observações</label>
            <input class="input" id="f_lnotas" placeholder="Ex.: uplink do switch, trunk VLAN, etc." />
          </div>

          <div style="color:var(--sub); font-size:12px;">
            * Campos obrigatórios.
          </div>
        `,
        onSave: () => {
          const deId = $("#f_de").value;
          const paraId = $("#f_para").value;
          if (!deId || !paraId) {
            toast("bad", "Validação", "Selecione 'De' e 'Para'.");
            return;
          }
          if (deId === paraId) {
            toast("bad", "Validação", "'De' e 'Para' não podem ser o mesmo dispositivo.");
            return;
          }

          const payload = {
            id: l.id || uid(),
            deId,
            paraId,
            tipo: $("#f_ltipo").value,
            velocidade: $("#f_vel").value,
            portaDe: $("#f_pde").value.trim(),
            portaPara: $("#f_ppara").value.trim(),
            notas: $("#f_lnotas").value.trim(),
            createdAt: l.createdAt || nowISO(),
            updatedAt: nowISO(),
          };

          if (isEdit) {
            const idx = appState.db.conexoes.findIndex(x => x.id === l.id);
            if (idx >= 0) appState.db.conexoes[idx] = payload;
            toast("ok", "Conexão", "Alterações salvas.");
          } else {
            appState.db.conexoes.push(payload);
            toast("ok", "Conexão", "Conexão criada.");
          }

          saveDB(appState.db);
          closeModal();
          render();
        }
      });

      // popular valores
      $("#f_de").value = l.deId || "";
      $("#f_para").value = l.paraId || "";
      $("#f_ltipo").value = l.tipo || "Cabo";
      $("#f_vel").value = l.velocidade || "1 Gbps";
      $("#f_pde").value = l.portaDe || "";
      $("#f_ppara").value = l.portaPara || "";
      $("#f_lnotas").value = l.notas || "";
    }

    function deleteLink(id) {
      const l = appState.db.conexoes.find(x => x.id === id);
      if (!l) return;

      openModal({
        title: "Excluir conexão",
        saveLabel: "Excluir",
        bodyHTML: `
          <div style="color:var(--sub); font-size:13px; line-height:1.5;">
            Você está prestes a excluir esta conexão.<br/>
            Esta ação não remove dispositivos.
          </div>
        `,
        onSave: () => {
          appState.db.conexoes = appState.db.conexoes.filter(x => x.id !== id);
          saveDB(appState.db);
          closeModal();
          toast("ok", "Exclusão", "Conexão removida.");
          render();
        }
      });
      $("#btnModalSave").classList.add("danger");
      $("#btnModalSave").classList.remove("primary");
    }

    // =========================
    // Import / Export / Reset
    // =========================
    function exportDB() {
      const payload = JSON.stringify(appState.db, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "gorillas-topologia-rede.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      toast("ok", "Exportação", "Arquivo JSON baixado.");
    }

    function importDBFromFile(file) {
      const fr = new FileReader();
      fr.onload = () => {
        const parsed = safeJSONParse(fr.result, null);
        if (!parsed || typeof parsed !== "object") {
          toast("bad", "Importação", "Arquivo inválido (JSON).");
          return;
        }
        if (!Array.isArray(parsed.dispositivos) || !Array.isArray(parsed.conexoes)) {
          toast("bad", "Importação", "JSON não parece do app (faltam coleções).");
          return;
        }
        appState.db = parsed;
        saveDB(appState.db);
        toast("ok", "Importação", "Dados importados com sucesso.");
        render();
      };
      fr.readAsText(file);
    }

    function resetDB() {
      openModal({
        title: "Resetar dados",
        saveLabel: "Resetar agora",
        bodyHTML: `
          <div style="color:var(--sub); font-size:13px; line-height:1.5;">
            Isso apagará a base local e restaurará dados iniciais de exemplo.<br/>
            Recomendação: exporte antes, se quiser manter um backup.
          </div>
        `,
        onSave: () => {
          appState.db = structuredClone(DEFAULT_DB);
          saveDB(appState.db);
          closeModal();
          toast("ok", "Reset", "Base restaurada.");
          render();
        }
      });
      $("#btnModalSave").classList.add("danger");
      $("#btnModalSave").classList.remove("primary");
    }

    // =========================
    // Helpers
    // =========================
    function groupBy(arr, keyFn) {
      const out = {};
      for (const it of arr) {
        const k = keyFn(it);
        out[k] = out[k] || [];
        out[k].push(it);
      }
      return out;
    }
    function countBy(arr, keyFn) {
      const out = {};
      for (const it of arr) {
        const k = keyFn(it);
        out[k] = (out[k] || 0) + 1;
      }
      return out;
    }

    // =========================
    // Render + Events
    // =========================
    function render() {
      appState.route = getRouteFromHash();
      setActiveNav(appState.route);

      const view = $("#view");
      let html = "";

      if (appState.route === "/dashboard") html = pageDashboard();
      else if (appState.route === "/dispositivos") html = pageDispositivos();
      else if (appState.route === "/conexoes") html = pageConexoes();
      else if (appState.route === "/topologia") html = pageTopologia();
      else if (appState.route === "/configuracoes") html = pageConfiguracoes();
      else {
        html = `
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2>Página não encontrada</h2>
                <p>Rota inválida: <b>${escapeHTML(appState.route)}</b></p>
              </div>
            </div>
            <button class="btn" type="button" id="goHome">← Voltar ao painel</button>
          </div>
        `;
      }

      view.innerHTML = html;

      // atualiza o pill de status com estado Firebase
      updateStatusPill();

      // bind per-route events
      bindEvents();
    }

    function bindEvents() {
      // Dashboard quick actions
      $("#dashNewDevice")?.addEventListener("click", () => openDeviceForm(null));
      $("#dashNewLink")?.addEventListener("click", () => openLinkForm(null));
      $("#goHome")?.addEventListener("click", () => navigate("/dashboard"));

      // Dispositivos
      $("#btnNewDevice")?.addEventListener("click", () => openDeviceForm(null));
      $("#searchDevices")?.addEventListener("input", (e) => {
        appState.searchDevices = e.target.value;
        render();
      });

      // Conexões
      $("#btnNewLink")?.addEventListener("click", () => openLinkForm(null));
      $("#searchLinks")?.addEventListener("input", (e) => {
        appState.searchLinks = e.target.value;
        render();
      });

      // Topologia
      $("#btnTopoRefresh")?.addEventListener("click", () => {
        toast("ok", "Topologia", "Desenho atualizado.");
        render();
      });

      // Configurações
      $("#cfgExport")?.addEventListener("click", exportDB);
      $("#cfgImport")?.addEventListener("click", () => $("#fileImport").click());
      $("#cfgReset")?.addEventListener("click", resetDB);

      // Delegation for table action buttons
      $("#view").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;

        const action = btn.dataset.action;
        const id = btn.dataset.id;

        if (action === "edit-device") {
          const d = appState.db.dispositivos.find(x => x.id === id);
          if (d) openDeviceForm(d);
        }
        if (action === "del-device") {
          deleteDevice(id);
        }
        if (action === "edit-link") {
          const l = appState.db.conexoes.find(x => x.id === id);
          if (l) openLinkForm(l);
        }
        if (action === "del-link") {
          deleteLink(id);
        }
      }, { once: true });

      // Global buttons
      $("#btnExport").onclick = exportDB;
      $("#btnImport").onclick = () => $("#fileImport").click();
      $("#btnReset").onclick = resetDB;

      // Quick sidebar actions
      $("#btnQuickNewDevice").onclick = () => {
        openDeviceForm(null);
        if (appState.route !== "/dispositivos") navigate("/dispositivos");
      };
      $("#btnQuickNewLink").onclick = () => {
        openLinkForm(null);
        if (appState.route !== "/conexoes") navigate("/conexoes");
      };
    }

    // Import file handler
    $("#fileImport").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (!file) return;
      importDBFromFile(file);
    });

    // init
    if (!location.hash) location.hash = "#/dashboard";

    // Carrega cache local instantaneamente, depois inicia sync Firebase
    appState.db = loadDBFromCache();
    render();
    initFirebaseSync();
  </script>
</body>

</html>
